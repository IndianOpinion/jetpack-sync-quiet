name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: composer lint

      - name: Coding standard
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Tests
        run: composer test

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck examples/count-spawn-sync.sh

      - name: Example log counter
        run: |
          out="$(bash examples/count-spawn-sync.sh examples/sample-access.log)"
          echo "$out"
          echo "$out" | grep -q '10/Nov/2026 *2 *4'
